# MySQL 数据源配置
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:hardware_store}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL 初始化配置
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
# 演示数据 demo-data.sql 会覆盖同 id 的商品、库存、客户和单据，生产环境绝不加载。
# 只有本地开发（run-dev.ps1）和测试配置会显式设置 SPRING_SQL_INIT_DATA_LOCATIONS=classpath:demo-data.sql。
# schema.sql 只含 CREATE TABLE IF NOT EXISTS，重复执行安全。

# Production never implicitly loads a stale data.sql from a previous build.
spring.sql.init.data-locations=${SPRING_SQL_INIT_DATA_LOCATIONS:optional:classpath:production-data.sql}
