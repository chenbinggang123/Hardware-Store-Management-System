# 应用基础配置
spring.application.name=hardware-store-system
spring.profiles.active=${APP_PROFILE:mysql}

# JSON 输出配置
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null

# 服务器配置
server.address=0.0.0.0
server.port=${SERVER_PORT:8084}
server.servlet.context-path=/api
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=31MB

# 登录令牌固定有效期，默认 8 小时。
auth.token.ttl-minutes=${AUTH_TOKEN_TTL_MINUTES:480}

# Agent 模型默认关闭。启用后可接入支持 OpenAI Chat Completions 工具调用协议的模型服务。
agent.model.enabled=${AGENT_MODEL_ENABLED:false}
agent.model.base-url=${AGENT_MODEL_BASE_URL:https://api.openai.com/v1}
agent.model.api-key=${AGENT_MODEL_API_KEY:}
agent.model.model=${AGENT_MODEL_NAME:}
agent.model.timeout-seconds=${AGENT_MODEL_TIMEOUT_SECONDS:20}

# Agent 附件：开发环境默认保存在应用目录；生产环境可切换为腾讯云 COS。
agent.attachment.max-size-bytes=${AGENT_ATTACHMENT_MAX_SIZE_BYTES:31457280}
agent.attachment.local-directory=${AGENT_ATTACHMENT_LOCAL_DIRECTORY:./data/agent-attachments}
agent.attachment.ocr-url=${AGENT_ATTACHMENT_OCR_URL:}
agent.attachment.ocr-timeout-seconds=${AGENT_ATTACHMENT_OCR_TIMEOUT_SECONDS:45}
agent.attachment.ffmpeg-path=${AGENT_ATTACHMENT_FFMPEG_PATH:ffmpeg}
agent.attachment.video-timeout-seconds=${AGENT_ATTACHMENT_VIDEO_TIMEOUT_SECONDS:60}
agent.attachment.storage=${AGENT_ATTACHMENT_STORAGE:local}
agent.attachment.cloud-env-id=${CLOUDBASE_ENV_ID:cloud1-d0gvllpf639d10665}
agent.attachment.cloud-download-host-suffixes=${AGENT_ATTACHMENT_CLOUD_HOST_SUFFIXES:.tcb.qcloud.la,.myqcloud.com}
agent.attachment.cloud-download-timeout-seconds=${AGENT_ATTACHMENT_CLOUD_TIMEOUT_SECONDS:20}
agent.attachment.cos.secret-id=${COS_SECRET_ID:}
agent.attachment.cos.secret-key=${COS_SECRET_KEY:}
agent.attachment.cos.region=${COS_REGION:}
agent.attachment.cos.bucket=${COS_BUCKET:}

# OCR 统一入口：auto 优先使用腾讯云 OCR，未配置时回退旧 HTTP 适配器。
# 腾讯云密钥必须使用仅具备 OCR 调用权限的 CAM 子用户密钥，不得写入源码或小程序。
ocr.provider=${OCR_PROVIDER:auto}
ocr.tencent.secret-id=${TENCENT_OCR_SECRET_ID:}
ocr.tencent.secret-key=${TENCENT_OCR_SECRET_KEY:}
ocr.tencent.region=${TENCENT_OCR_REGION:}
ocr.tencent.timeout-seconds=${TENCENT_OCR_TIMEOUT_SECONDS:45}

# Excel 文件任务：解析、字段映射、商品匹配和变更预览均使用暂存表，不直接写入商品、价格或库存。
excel.task.max-size-bytes=${EXCEL_TASK_MAX_SIZE_BYTES:10485760}

# 图片表格 OCR：mode=auto 时，配置了 URL 走统一适配服务（可封装 PaddleOCR 或 WPS），
# 否则直接使用上面的腾讯云 OCR 密钥调用表格识别 V3；两者都未配置时图片任务保存为失败任务，不会伪造识别结果。
# mode 可强制为 http 或 tencent。
table.ocr.mode=${TABLE_OCR_MODE:auto}
table.ocr.url=${TABLE_OCR_URL:}
table.ocr.provider=${TABLE_OCR_PROVIDER:http-adapter}
table.ocr.timeout-seconds=${TABLE_OCR_TIMEOUT_SECONDS:60}
